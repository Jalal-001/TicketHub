name: tickethub

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: tickethub-sql-server
    environment: 
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: ${TICKETHUB_PASSWORD}
        
    ports:
        - 1433:1433
    volumes:
        - sqlserver_data:/var/opt/mssql
    networks:
        - tickethub-network  
    restart: unless-stopped
    healthcheck:
        test:
          - CMD-SHELL
          - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s


  redis: 
    image: redis:7.4.12-alpine3.21
    container_name: tickethub-redis
    environment:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
        - sh
        - -c
        - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
        - 6379:6379
    volumes:
        - redis_data:/data
    networks:
        - tickethub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
    sqlserver_data:
        driver: local
    redis_data:
        driver: local
networks:
    tickethub-network:
        driver: bridge
    


